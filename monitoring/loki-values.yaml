# Lightweight Loki-Stack Configuration for Local Rancher Desktop K3s

# Disable Grafana inside the loki-stack helm release since we already run Prometheus-Grafana
grafana:
  enabled: false

# Loki Configuration (Single-replica, filesystem storage)
loki:
  enabled: true
  isDistributed: false
  persistence:
    enabled: false  # In-memory/ephemeral to keep disk and VM footprint minimal
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    limits_config:
      retention_period: 24h
    chunk_store_config:
      max_look_back_period: 24h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 24h

# Promtail Configuration (DaemonSet that gathers container logs from /var/log/pods)
promtail:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
