apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scaler-network-policy
  namespace: scaler-app
spec:
  podSelector:
    matchLabels:
      app: scaler-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
