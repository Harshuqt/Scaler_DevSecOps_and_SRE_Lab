apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-app-v3
  labels:
    app: scaler-app
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaler-app
      version: v3
  template:
    metadata:
      labels:
        app: scaler-app
        version: v3
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: scaler-app
          image: ghcr.io/harshuqt/scaler:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_VERSION
              value: "v3"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "400Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
