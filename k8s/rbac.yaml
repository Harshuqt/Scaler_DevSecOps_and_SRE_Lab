apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler-sa
  namespace: scaler-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaler-role
  namespace: scaler-app
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-rolebinding
  namespace: scaler-app
subjects:
  - kind: ServiceAccount
    name: scaler-sa
    namespace: scaler-app
roleRef:
  kind: Role
  name: scaler-role
  apiGroup: rbac.authorization.k8s.io
