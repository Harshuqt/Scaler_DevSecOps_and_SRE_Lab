apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-app-v1
  namespace: scaler-app
  labels:
    app: scaler-app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaler-app
      version: v1
  template:
    metadata:
      labels:
        app: scaler-app
        version: v1
    spec:
      serviceAccountName: scaler-sa
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: preflight-check
          image: busybox:1.37
          command: ['sh', '-c', 'echo "Running pre-flight checks for scaler application..." && sleep 2 && echo "Pre-flight checks passed."']
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: scaler-app
          image: ghcr.io/harshuqt/scaler:v1-78381fae27abc2fe4962a8b09cb56e5507090ba0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_VERSION
              value: "v1"
          envFrom:
            - configMapRef:
                name: scaler-config
            - secretRef:
                name: scaler-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "400Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
