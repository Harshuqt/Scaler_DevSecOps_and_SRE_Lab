name: Release Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - 'monitoring/**'
      - 'argocd/**'
      - 'README.md'
      - 'readme.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v1, v2, v3]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner in lowercase
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/scaler:${{ matrix.version }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/scaler:${{ matrix.version }}-${{ github.sha }}

  update-manifests:
    name: Update K8s Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract repository owner in lowercase
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Update Image Tags in Manifests
        run: |
          OWNER="${{ steps.repo_owner.outputs.owner }}"
          SHA="${{ github.sha }}"
          for v in v1 v2 v3; do
            sed -i "s|image: ghcr.io/.*/scaler:.*|image: ghcr.io/${OWNER}/scaler:${v}-${SHA}|g" k8s/deployment-${v}.yaml
          done

      - name: Create GitOps Update Branch and Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="chore/gitops-update-${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"

          git add k8s/
          if git diff --staged --quiet; then
            echo "No manifest changes detected."
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            git commit -m "chore(gitops): update deployment images to ${SHORT_SHA}"
            git push -u origin "$BRANCH_NAME"

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(gitops): update k8s manifests to commit ${SHORT_SHA}" \
              --body "Automated GitOps Pull Request generated by Release Pipeline. Updates all 3 Deployment manifests with newly released container images."
          fi
