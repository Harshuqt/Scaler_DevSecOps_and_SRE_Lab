apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scaler-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Harshuqt/Scaler_DevSecOps_and_SRE_Lab.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scaler-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
